name: Final portfolio verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/usable-cms-controls]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate CMS YAML
        run: |
          python - <<'PY'
          import yaml
          with open("config.yml", encoding="utf-8") as f:
              config = yaml.safe_load(f)
          fields = config["collections"][0]["files"][0]["fields"]
          names = [field.get("name") for field in fields if isinstance(field, dict)]
          assert "sections" in names, names
          assert "fonts" in names, names
          sections = next(field for field in fields if isinstance(field, dict) and field.get("name") == "sections")
          section_fields = [field.get("name") for field in sections["fields"] if isinstance(field, dict)]
          assert "blocks" in section_fields, section_fields
          print("CMS YAML structure is valid")
          PY
      - name: Compile and build
        run: |
          python -m py_compile build.py
          python build.py
          test -s dist/index.html
          test -s dist/admin/config.yml
      - name: Test section order, visibility, custom content and certificate hover
        run: |
          python - <<'PY'
          import json, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as tmp:
              work = pathlib.Path(tmp) / "site"
              shutil.copytree(root, work, ignore=shutil.ignore_patterns(".git", ".github"))
              data_path = work / "site.json"
              data = json.loads(data_path.read_text(encoding="utf-8"))
              data["sections"] = [
                  {"id": "training-projects", "title": "Training and Projects", "visible": True},
                  {"id": "skills", "title": "My Skills", "visible": True},
                  {"id": "publications", "title": "Publications", "visible": True,
                   "blocks": [{"type": "heading", "heading": "Selected writing"},
                              {"type": "text", "text": "A custom section test."}]},
                  {"id": "education", "title": "Education", "visible": False},
                  {"id": "me", "title": "About", "visible": True},
                  {"id": "about", "title": "Experience", "visible": True},
                  {"id": "activities", "title": "Leadership", "visible": True},
                  {"id": "design", "title": "Design", "visible": True}
              ]
              data_path.write_text(json.dumps(data), encoding="utf-8")
              subprocess.run(["python", "build.py"], cwd=work, check=True)
              page = (work / "dist/index.html").read_text(encoding="utf-8")
              ids = ["training-projects", "skills", "publications", "me", "about", "activities", "design"]
              positions = [page.index(f'<section id="{sid}"') for sid in ids]
              assert positions == sorted(positions), positions
              assert '<section id="education">' not in page
              assert 'href="#publications">Publications</a>' in page
              assert "A custom section test." in page
              assert 'id="cert-hover"' in page
              certs = data.get("training_details", [])
              no_cert = [x for x in certs if not x.get("certificate")]
              if no_cert:
                  title = no_cert[0].get("title", "")
                  assert title
                  row = next(line for line in page.split("<li") if 'class="training-item"' in line and title in line)
                  assert "data-cert=" not in row
                  assert "cert-preview" not in row
              print("Section reorder, hide/show, rename, custom content and hover-only certificates passed")
          PY
