# Decap CMS: the login-protected editor at /admin
backend:
  name: github
  repo: mehshan3112/mehshan-site
  branch: main
  base_url: https://mehshan.pages.dev   # your Cloudflare address, no slash at the end
  auth_endpoint: auth

media_folder: images
public_folder: /images
locale: en

collections:
  - name: site
    label: Website
    files:
      - name: content
        label: All site content
        file: site.json
        format: json
        fields:
          - {label: Website address (no slash at the end), name: site_url, widget: string}
          - label: Fonts
            name: fonts
            widget: object
            required: false
            fields:
              - {label: Main text font (empty = Li Subha Letterpress), name: body, widget: select, options: ["Li Subha Letterpress", "Fraunces", "Hanken Grotesk", "Special Elite", "Courier Prime", "Playfair Display", "Merriweather", "Inter", "Noto Serif Bengali", "Noto Sans Bengali"], required: false}
              - {label: "Main text font, other: type any Google Fonts name or the name of an uploaded font (beats the choice above)", name: body_other, widget: string, required: false}
              - {label: Headings and name font (empty = Li Subha Letterpress), name: headings, widget: select, options: ["Li Subha Letterpress", "Fraunces", "Hanken Grotesk", "Special Elite", "Courier Prime", "Playfair Display", "Merriweather", "Inter", "Noto Serif Bengali", "Noto Sans Bengali"], required: false}
              - {label: "Headings font, other: type any Google Fonts name or the name of an uploaded font (beats the choice above)", name: headings_other, widget: string, required: false}
          - label: Uploaded fonts (add your own font files here)
            name: custom_fonts
            widget: list
            required: false
            fields:
              - {label: "Font name (you type this name in the Fonts boxes, or inside text like {Name|words})", name: name, widget: string}
              - {label: Font file (.ttf .otf .woff2), name: file, widget: file}
          - {label: "Credit line at the very bottom of the page (leave empty for none)", name: font_credit, widget: string, required: false}
          - label: Top of the page (hero)
            name: hero
            widget: object
            fields:
              - {label: Big name, name: title, widget: string}
              - {label: Line under the name, name: subtitle, widget: string}
              - {label: Intro text, name: intro, widget: text, hint: "To show some words in another font, type {Font Name|those words}"}
              - {label: Portrait photo, name: image, widget: image}
              - {label: Portrait description (for screen readers), name: image_alt, widget: string}
          - label: About section
            name: about
            widget: object
            fields:
              - label: Big words (one per line)
                name: headline
                widget: list
                field: {label: Word, name: w, widget: string}
              - {label: Short text, name: text, widget: text, hint: "To show some words in another font, type {Font Name|those words}"}
              - label: Photos
                name: photos
                widget: list
                fields:
                  - {label: Photo, name: image, widget: image}
                  - {label: Description (for screen readers), name: alt, widget: string}
                  - {label: Caption, name: caption, widget: string}
          - {label: Career objective (above experience), name: objective, widget: text, hint: "To show some words in another font, type {Font Name|those words}"}
          - {label: Dyeing machine caption, name: dye_caption, widget: string}
          - {label: Supply chain animation caption, name: supply_caption, widget: string, required: false}
          - label: Experience and leadership
            name: experience
            widget: list
            fields:
              - {label: Role, name: role, widget: string}
              - {label: Organisation, name: org, widget: string}
              - {label: Dates, name: dates, widget: string}
              - {label: Place, name: place, widget: string, required: false}
              - {label: Letters shown if there is no logo, name: initials, widget: string, required: false}
              - {label: Logo, name: logo, widget: image, required: false}
              - {label: Show the dyeing machine animation here (old setting), name: show_dye_machine, widget: boolean, default: false, required: false}
              - {label: Animation beside this entry (overrides the old setting), name: animation, widget: select, options: ["dyeing machine", "supply chain", "none"], required: false}
              - label: Bullet points (use *word* for italics)
                name: bullets
                widget: list
                field: {label: Bullet, name: b, widget: text, hint: "To show some words in another font, type {Font Name|those words}"}
              - {label: Link text, name: link_text, widget: string, required: false}
              - {label: Link address, name: link_url, widget: string, required: false}
          - label: Leadership and extracurricular activities
            name: activities
            widget: list
            fields:
              - {label: Role, name: role, widget: string}
              - {label: Organisation, name: org, widget: string}
              - {label: Dates, name: dates, widget: string}
              - {label: Letters shown if there is no logo, name: initials, widget: string, required: false}
              - {label: Logo, name: logo, widget: image, required: false}
              - label: Bullet points (use *word* for italics)
                name: bullets
                widget: list
                field: {label: Bullet, name: b, widget: text, hint: "To show some words in another font, type {Font Name|those words}"}
              - {label: Link text, name: link_text, widget: string, required: false}
              - {label: Link address, name: link_url, widget: string, required: false}
              - label: Photos
                name: photos
                widget: list
                required: false
                fields:
                  - {label: Photo, name: image, widget: image}
                  - {label: Caption, name: caption, widget: string, required: false}
                  - {label: Picture fit (whole picture shows everything, crop to fill fills the box), name: fit, widget: select, options: ["whole picture", "crop to fill"], required: false}
          - label: Education
            name: education
            widget: list
            fields:
              - {label: Degree, name: degree, widget: string}
              - {label: School, name: school, widget: string}
              - {label: Dates, name: dates, widget: string}
          - label: Skills
            name: skills
            widget: list
            fields:
              - {label: Group title, name: title, widget: string}
              - label: Items
                name: items
                widget: list
                field: {label: Item, name: i, widget: string}
          - label: Training programs
            name: training
            widget: list
            field: {label: Program, name: p, widget: string}
          - label: Project work
            name: project
            widget: object
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Text, name: text, widget: text}
          - label: Design section
            name: designs
            widget: object
            fields:
              - {label: Intro text, name: intro, widget: text}
              - {label: Behance profile link, name: behance, widget: string}
              - label: Designs (drag to reorder)
                name: items
                widget: list
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Type (Poster, Event banner...), name: kind, widget: string}
                  - {label: Behance project link, name: link, widget: string}
                  - {label: Image, name: image, widget: image}
          - label: Contact
            name: contact
            widget: object
            fields:
              - {label: Email, name: email, widget: string}
              - {label: LinkedIn link, name: linkedin, widget: string}
              - {label: Behance link, name: behance, widget: string}
              - {label: Facebook link, name: facebook, widget: string}
              - {label: Quote at the bottom, name: quote, widget: string}
              - {label: Quote author, name: quote_author, widget: string}
